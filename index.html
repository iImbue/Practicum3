<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecycLoop - Login</title>
</head>
<body>

    <header style="text-align: center;">
        <h1>RecycLoop</h1>
        <p>Circular Economy Recycling Solutions</p>
    </header>

    <hr>

    <main style="max-width: 400px; margin: 30px auto;">
        <h2 style="text-align: center;">Account Login</h2>

        <!-- Form action links to dashboard.html after successful login -->
        <form action="dashboard.html" method="GET">
            <p>
                <label for="login-email">Email Address:</label><br>
                <input type="email" id="login-email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <label for="login-password">Password:</label><br>
                <input type="password" id="login-password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <button type="submit" style="width: 100%; padding: 10px; background-color: #2e7d32; color: white; border: none; cursor: pointer;">
                    Log In
                </button>
            </p>
        </form>

        <!-- Link to Page 2 (Signup) -->
        <p style="text-align: center;">
            New to RecycLoop? <a href="signup.html">Create an account here</a>
        </p>
    </main>

</body>
</html>
